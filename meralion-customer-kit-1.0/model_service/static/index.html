<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MERaLiON A100 Bench</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18211d;
      --muted: #617069;
      --paper: #f4f3ed;
      --surface: #fffefa;
      --line: #cfd4ce;
      --accent: #d7432f;
      --accent-dark: #a62d1f;
      --green: #17765b;
      --amber: #ad6b0b;
      --blue: #2667a7;
      --shadow: 0 18px 45px rgba(24, 33, 29, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(24, 33, 29, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 33, 29, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      font-family: "Avenir Next", Avenir, "Century Gothic", sans-serif;
      letter-spacing: 0;
    }

    button, input { font: inherit; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 56px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 22px;
      border-bottom: 2px solid var(--ink);
    }

    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand strong { font-family: "Didot", "Bodoni 72", serif; font-size: 28px; }
    .brand span { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); }
    .status.ready .dot { background: var(--green); }
    .status.error .dot { background: var(--accent); }
    .status.loading .dot { animation: pulse 1.1s infinite; }

    main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(290px, 0.75fr); gap: 24px; padding-top: 24px; }
    .workspace, .sidebar { display: grid; gap: 18px; align-content: start; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .run-panel { padding: 26px; }
    .kicker { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-family: "Didot", "Bodoni 72", serif; font-size: clamp(32px, 5vw, 56px); font-weight: 700; line-height: 1; }

    .controls { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-top: 28px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; }

    input {
      width: 100%;
      min-height: 46px;
      padding: 0 13px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #aab3ad;
      border-radius: 4px;
      outline: none;
    }

    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(38, 103, 167, 0.14); }

    button {
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 800;
    }

    .run-button { align-self: end; color: white; background: var(--accent); }
    .run-button:hover { background: var(--accent-dark); }
    .run-button:disabled { cursor: wait; opacity: 0.55; }
    .secondary { min-height: 34px; padding: 0 10px; color: var(--ink); background: transparent; border: 1px solid var(--line); font-size: 12px; }

    .client-timer { min-height: 22px; margin: 12px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }

    .result { min-height: 260px; padding: 26px; }
    .result-head, .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h2 { margin: 0; font-family: "Didot", "Bodoni 72", serif; font-size: 24px; }

    .transcript {
      margin: 24px 0 0;
      font-family: "Didot", "Bodoni 72", serif;
      font-size: clamp(22px, 3.4vw, 36px);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .empty { color: #87918b; font-family: inherit; font-size: 16px; }
    .badge { padding: 4px 8px; border-radius: 3px; color: var(--green); background: #e4f1ec; font-size: 11px; font-weight: 800; text-transform: uppercase; }

    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
    .metric { min-width: 0; padding: 18px; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .metric:nth-child(3n) { border-right: 0; }
    .metric-name { display: block; min-height: 32px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .metric-value { display: block; margin-top: 7px; font-family: "DIN Alternate", "Avenir Next", sans-serif; font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .metric-value.na { color: #8d9691; font-size: 15px; }

    .side-panel { padding: 20px; }
    .model-list { display: grid; gap: 13px; margin: 18px 0 0; }
    .model-row { display: grid; gap: 3px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
    .model-row:last-child { padding-bottom: 0; border: 0; }
    .model-row span { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .model-row strong { font-size: 13px; overflow-wrap: anywhere; }

    .history { display: grid; gap: 10px; margin-top: 16px; }
    .history-item { padding: 12px 0; border-top: 1px solid var(--line); }
    .history-item button { width: 100%; min-height: 0; padding: 0; text-align: left; background: transparent; }
    .history-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
    .history-text { display: -webkit-box; margin-top: 6px; overflow: hidden; font-family: "Didot", serif; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }

    .error-box { margin-top: 16px; padding: 12px; color: #7e2419; background: #f9e7e3; border-left: 3px solid var(--accent); font-size: 13px; }
    [hidden] { display: none !important; }

    @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.75); } }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .sidebar { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 600px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 14px; }
      header { align-items: flex-start; flex-direction: column; gap: 8px; }
      .brand { flex-wrap: wrap; }
      .run-panel, .result { padding: 20px; }
      .controls { grid-template-columns: 1fr; }
      .run-button { width: 100%; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .metric:nth-child(3n) { border-right: 1px solid var(--line); }
      .metric:nth-child(2n) { border-right: 0; }
      .sidebar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><strong>MERaLiON</strong><span>A100 transcription bench</span></div>
      <div id="status" class="status loading" role="status"><span class="dot"></span><span id="statusText">Checking model</span></div>
    </header>

    <main>
      <div class="workspace">
        <section class="panel run-panel">
          <p class="kicker">Private Blob input</p>
          <h1>Speech, measured.</h1>
          <div class="controls">
            <label>Blob name
              <input id="blobName" list="samples" value="compatibility/4_codeswitch_singlish.wav" autocomplete="off">
              <datalist id="samples"><option value="compatibility/4_codeswitch_singlish.wav"></option></datalist>
            </label>
            <button id="runButton" class="run-button" type="button">Run benchmark</button>
          </div>
          <p id="clientTimer" class="client-timer">Ready for a request</p>
          <div id="errorBox" class="error-box" hidden></div>
        </section>

        <section class="panel result" aria-live="polite">
          <div class="result-head"><h2>Transcript</h2><span id="runBadge" class="badge" hidden></span></div>
          <p id="transcript" class="transcript empty">No completed run</p>
        </section>

        <section id="metrics" class="panel metrics" aria-label="Benchmark metrics"></section>
      </div>

      <aside class="sidebar">
        <section class="panel side-panel">
          <div class="section-head"><h2>Runtime</h2></div>
          <div class="model-list">
            <div class="model-row"><span>Model</span><strong id="modelId">MERaLiON/MERaLiON-3-3B-ASR</strong></div>
            <div class="model-row"><span>GPU</span><strong id="gpuName">Awaiting run</strong></div>
            <div class="model-row"><span>Backend</span><strong id="backend">vLLM 0.16.0</strong></div>
          </div>
        </section>

        <section class="panel side-panel">
          <div class="section-head"><h2>Runs</h2><button id="exportButton" class="secondary" type="button">Export JSON</button></div>
          <div id="history" class="history"><p class="empty">No saved runs</p></div>
        </section>
      </aside>
    </main>
  </div>

  <script>
    const endpoint = "/v1/benchmark/transcriptions";
    const historyKey = "meralion-benchmark-runs";
    const status = document.querySelector("#status");
    const statusText = document.querySelector("#statusText");
    const runButton = document.querySelector("#runButton");
    const blobName = document.querySelector("#blobName");
    const transcript = document.querySelector("#transcript");
    const clientTimer = document.querySelector("#clientTimer");
    const errorBox = document.querySelector("#errorBox");
    const runBadge = document.querySelector("#runBadge");
    const metrics = document.querySelector("#metrics");
    let timerId = null;
    let history = JSON.parse(localStorage.getItem(historyKey) || "[]");

    const metricDefinitions = [
      ["Audio duration", "audio_duration_seconds", "s"],
      ["Output tokens", "output_tokens", ""],
      ["Server request", "server_request_ms", "ms"],
      ["Model request", "model_request_ms", "ms"],
      ["End-to-end rate", "end_to_end_tokens_per_second", "tok/s"],
      ["First token", "prefill_to_first_token_ms", "ms"]
    ];

    function setStatus(kind, text) {
      status.className = `status ${kind}`;
      statusText.textContent = text;
    }

    function metricValue(result, key) {
      if (key in result) return result[key];
      return result.timings?.[key];
    }

    function renderMetrics(result = null) {
      metrics.replaceChildren(...metricDefinitions.map(([label, key, unit]) => {
        const item = document.createElement("div");
        item.className = "metric";
        const name = document.createElement("span");
        name.className = "metric-name";
        name.textContent = label;
        const value = document.createElement("strong");
        const raw = result ? metricValue(result, key) : null;
        value.className = `metric-value${raw == null ? " na" : ""}`;
        value.textContent = raw == null ? "Unavailable" : `${Number(raw).toLocaleString(undefined, { maximumFractionDigits: 3 })}${unit ? ` ${unit}` : ""}`;
        if (raw == null && result?.unavailable_metrics?.[key]) value.title = result.unavailable_metrics[key];
        item.append(name, value);
        return item;
      }));
    }

    function showResult(result) {
      transcript.className = "transcript";
      transcript.textContent = result.text;
      runBadge.hidden = false;
      runBadge.textContent = result.cold ? "Cold process run" : "Warm run";
      document.querySelector("#modelId").textContent = result.model_id;
      document.querySelector("#gpuName").textContent = result.gpu_name;
      document.querySelector("#backend").textContent = result.backend;
      renderMetrics(result);
    }

    function renderHistory() {
      const root = document.querySelector("#history");
      if (!history.length) {
        root.innerHTML = '<p class="empty">No saved runs</p>';
        return;
      }
      root.replaceChildren(...history.slice(0, 8).map((run) => {
        const item = document.createElement("div");
        item.className = "history-item";
        const button = document.createElement("button");
        button.type = "button";
        button.innerHTML = `<span class="history-meta"><span>${new Date(run.client_timestamp).toLocaleString()}</span><span>${run.output_tokens} tok</span></span><span class="history-text"></span>`;
        button.querySelector(".history-text").textContent = run.text;
        button.addEventListener("click", () => showResult(run));
        item.append(button);
        return item;
      }));
    }

    async function checkReady() {
      setStatus("loading", "Starting benchmark frontend");
      try {
        const response = await fetch("/health/ready", { cache: "no-store" });
        if (!response.ok) throw new Error("Frontend is loading");
        setStatus("ready", "Frontend ready · A100 starts on run");
        runButton.disabled = false;
      } catch {
        setTimeout(checkReady, 10000);
      }
    }

    async function runBenchmark() {
      const name = blobName.value.trim();
      if (!name) return;
      runButton.disabled = true;
      errorBox.hidden = true;
      transcript.className = "transcript empty";
      transcript.textContent = "Transcribing audio...";
      setStatus("loading", "Inference running");
      const started = performance.now();
      timerId = setInterval(() => {
        clientTimer.textContent = `Browser elapsed ${((performance.now() - started) / 1000).toFixed(1)} s`;
      }, 100);
      try {
        const wakeResponse = await fetch("/v1/model/wake", { method: "POST" });
        if (!wakeResponse.ok) throw new Error("Could not start the A100 model");
        setStatus("loading", "Waking A100 model");
        while (true) {
          await new Promise((resolve) => setTimeout(resolve, 10000));
          const statusResponse = await fetch("/v1/model/status", { cache: "no-store" });
          const statusBody = await statusResponse.json();
          if (statusResponse.ok && statusBody.status === "ready") break;
          if (statusBody.status === "error") throw new Error(statusBody.error || "A100 startup failed");
        }
        setStatus("loading", "Inference running");
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ blob_name: name })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || `Request failed (${response.status})`);
        body.client_elapsed_ms = Number((performance.now() - started).toFixed(3));
        body.client_timestamp = new Date().toISOString();
        history.unshift(body);
        history = history.slice(0, 20);
        localStorage.setItem(historyKey, JSON.stringify(history));
        showResult(body);
        renderHistory();
        setStatus("ready", "Frontend ready · A100 is warm");
      } catch (error) {
        transcript.className = "transcript empty";
        transcript.textContent = "Run did not complete";
        errorBox.textContent = error.message;
        errorBox.hidden = false;
        setStatus("error", "Request failed");
      } finally {
        clearInterval(timerId);
        clientTimer.textContent = `Browser elapsed ${((performance.now() - started) / 1000).toFixed(1)} s`;
        runButton.disabled = false;
      }
    }

    document.querySelector("#exportButton").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(history, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `meralion-runs-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
    });
    runButton.addEventListener("click", runBenchmark);
    blobName.addEventListener("keydown", (event) => { if (event.key === "Enter") runBenchmark(); });

    renderMetrics();
    renderHistory();
    runButton.disabled = true;
    checkReady();
  </script>
</body>
</html>
